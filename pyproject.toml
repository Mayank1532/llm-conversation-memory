[project]
name = "llm-conversation-memory"
version = "0.1.0"
description = "Local LLM conversation memory and context management assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.13.0",
    "transformers>=5.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
